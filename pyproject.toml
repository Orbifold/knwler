[project]
name = "knwler"
license = "MIT"

version = "1.1.2"
description = "Fast and accurate graph extraction from text using LLMs"
authors = [
    { name = "Francois Vanderseypen (Orbifold Consulting)", email = "swa@orbifold.net" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "tiktoken>=0.12.0",
    "typer>=0.21.1",
    "rich>=14.3.2",
    "networkx>=3.6.1",
    "pymupdf4llm[layout,ocr]>=0.2.9",
    "jinja2>=3.1.6",
    "anthropic>=0.40.0",
    "markdown>=3.10.2",
    "openai>=2.26.0",
    "google-genai>=1.67.0",
    "beautifulsoup4>=4.14.2",
    "markdownify>=1.2.2",
    "wikipedia-api>=0.8.1"
]
[project.urls]
Homepage = "https://knwler.com"
Repository = "https://github.com/Orbifold/knwler"
Documentation = "https://github.com/Orbifold/knwler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knwler"]

[tool.hatch.build]
include = [
  "knwler/**/*.py",
  "knwler/**/*.json",
  "knwler/templates/**",
  "knwler/benchmark/**",
  "knwler/integrations/**",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
neo4j = [
    "neo4j>=6.1.0",
]
surreal = [
    "surrealdb>=1.0.8",
] 

[project.scripts]
knwler = "knwler.cli:main"
tests="tests.run:main"
benchmark="benchmark.run:main"
