[project]
name = "knwler"
license = "MIT"

version = "0.4.1"
description = "Fast and accurate graph extraction from text using LLMs"
authors = [
    { name = "Francois Vanderseypen (Orbifold Consulting)", email = "swa@orbifold.net" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "requests>=2.31.0",
    "tiktoken>=0.12.0",
    "typer>=0.21.1",
    "rich>=14.3.2",
    "networkx>=3.6.1",
    "pymupdf4llm[layout,ocr]>=0.2.9",
    "jinja2>=3.1.6",
    "helix-py>=0.2.31",
]
[project.urls]
Homepage = "https://knwler.com"
Repository = "https://github.com/Orbifold/knwler"
Documentation = "https://github.com/Orbifold/knwler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knwler"]

[tool.hatch.build]
include = [
  "knwler/**/*.py",
  "knwler/**/*.json",
  "knwler/templates/**",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
knwler = "knwler.cli:app"
tests="tests.run:main"
